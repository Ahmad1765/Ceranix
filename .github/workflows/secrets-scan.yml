name: Secrets scan

# Catches accidentally-committed secrets before they hit a public mirror.
# Runs on every PR, and weekly against main so a key that snuck through a
# squash-merge still surfaces.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit in the PR, not just
          # the diff against the merge base.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only required for organisations. Personal repos
          # work without it; the action skips the license check.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
