name: CodeQL

# Weekly schedule + push/PR to main. Keeps detection latency low for newly
# merged code while the weekly run picks up any newly published rules.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:17 UTC — off-peak, avoids the top-of-hour cron stampede.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # TypeScript/JavaScript share the same CodeQL language.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes the default security suite plus
          # quality rules — keeps the noise:signal favourable for an app
          # codebase. Switch to "security-extended" if false positives bite.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
