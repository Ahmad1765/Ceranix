name: Supabase migrations

# Validates that any SQL touched in a PR can be applied to a clean
# Postgres before it gets merged. Catches typos, missing dependencies,
# and policy-order mistakes before they hit production.
#
# Triggers only when SQL changes — keeps non-DB PRs fast.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**/*.sql'
  pull_request:
    paths:
      - 'supabase/**/*.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-on-empty-postgres:
    name: Apply SQL to ephemeral Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Supabase's own Postgres, not vanilla postgres:16.
        #
        # This job had been failing since at least 2026-07-13 with
        # `role "anon" does not exist`, and roles were only the first wall:
        # 20260729120100_push_webhooks.sql runs `create extension pg_net` and
        # reads vault.decrypted_secrets. A missing role can be stubbed; a
        # missing EXTENSION cannot. This image ships the Supabase roles, pg_net
        # and supabase_vault, so the project's SQL can actually be applied.
        #
        # Pinned to the 17.x line to match the live project (17.6.1.x).
        image: supabase/postgres:17.6.1.160
        env:
          # POSTGRES_PASSWORD only. Setting POSTGRES_USER/POSTGRES_DB overrides
          # this image's own bootstrap: its docker-entrypoint runs migrate.sh,
          # which connects as `supabase_admin` — a role the default init
          # sequence creates. Overriding the superuser skipped that and the
          # container died with `role "supabase_admin" does not exist`.
          # The image already defaults to user `postgres` / database `postgres`,
          # which is what the PG* env below connects as.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Stub Supabase auth / extension surface
        # The image supplies the roles, pg_net and supabase_vault. What it does
        # NOT supply is the `auth` and `storage` schemas — those are created by
        # GoTrue and Storage migrations, not by Postgres itself — so the project
        # SQL still needs the auth.uid()/auth.role() surface stubbed here.
        #
        # Everything below is written to be idempotent and image-agnostic: each
        # piece is created only if absent, so this step still does the right
        # thing if the base image changes.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            -- Roles. Supplied by supabase/postgres, recreated defensively here
            -- because CREATE ROLE has no IF NOT EXISTS.
            DO $do$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN NOINHERIT;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN NOINHERIT;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
              END IF;
            END
            $do$;

            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

            -- push_webhooks.sql reads vault.decrypted_secrets. The extension
            -- creates the schema itself, so do not pre-create it.
            CREATE EXTENSION IF NOT EXISTS supabase_vault;

            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS
              $$ SELECT '00000000-0000-0000-0000-000000000000'::uuid $$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS
              $$ SELECT 'authenticated'::text $$;
            CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS
              $$ SELECT '{}'::jsonb $$;

            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid primary key default uuid_generate_v4()
            );

            CREATE SCHEMA IF NOT EXISTS storage;
            CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid primary key default uuid_generate_v4(),
              bucket_id text,
              name text,
              owner uuid
            );
          SQL

      - name: Apply migration SQL files in order
        run: |
          shopt -s nullglob
          # Concatenate so cross-file dependencies (table → trigger → policy)
          # resolve in lexical order. Adjust if a project-specific order
          # emerges.
          files=$(find supabase -maxdepth 2 -type f -name '*.sql' \
                   -not -path 'supabase/functions/*' \
                   -not -path 'supabase/.temp/*' \
                   | sort -V)
          if [[ -z "$files" ]]; then
            echo "No SQL files found."
            exit 0
          fi
          
          # Ensure setup.sql runs first if it exists
          setup_file=$(echo "$files" | grep -m1 'setup\.sql$' || true)
          if [[ -n "$setup_file" ]]; then
            echo "::group::psql $setup_file"
            psql -v ON_ERROR_STOP=1 -f "$setup_file"
            echo "::endgroup::"
            files=$(echo "$files" | grep -v 'setup\.sql$') || true
          fi

          for f in $files; do
            echo "::group::psql $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
