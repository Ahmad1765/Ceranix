name: EAS

# Native builds and over-the-air (OTA) updates via EAS. Deliberately
# workflow_dispatch-only: `eas build` consumes build credits and OTA updates
# ship code to real devices, so both stay manual/intentional rather than firing
# on every push. Trigger from the Actions tab → EAS → Run workflow.
#
# Prerequisites (one-time):
#   1. `eas init` locally to create the project + set EAS_PROJECT_ID.
#   2. Add an EXPO_TOKEN repo secret (expo.dev → Settings → Access tokens).
#   3. Create EAS environment variables for the development/preview/production
#      environments (EXPO_PUBLIC_* etc.) so builds get the right config.
# See DEPLOYMENT.md for the full runbook.

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options: [update, build]
        default: update
      profile:
        description: Build profile / update channel
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: "Target platform (build only)"
        type: choice
        options: [all, android, ios]
        default: all
      message:
        description: "Update message (update only; defaults to the commit sha)"
        type: string
        required: false

# Never let two EAS runs on the same ref race each other.
concurrency:
  group: eas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas:
    name: EAS ${{ inputs.command }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing EXPO_TOKEN::Create an access token at https://expo.dev/settings/access-tokens and add it under Settings → Secrets and variables → Actions as EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        if: ${{ inputs.command == 'update' }}
        run: |
          eas update \
            --branch "${{ inputs.profile }}" \
            --message "${{ inputs.message || format('CI update {0}', github.sha) }}" \
            --non-interactive

      - name: Kick off native build
        if: ${{ inputs.command == 'build' }}
        # --no-wait returns as soon as the build is queued; follow it in the EAS
        # dashboard. Drop --no-wait to block the job until the build finishes.
        run: |
          eas build \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait
